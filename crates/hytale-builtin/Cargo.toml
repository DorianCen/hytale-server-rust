[package]
name = "hytale-builtin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hytale-core = { path = "../hytale-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = [
    "block-tick",
    "random-tick",
    "falling-blocks",
    "block-physics",
    "fluid",
    "weather",
    "npc",
    "encounter-manager",
]
# `Builtin` modules that mirror the Java `builtin/` plugins selected for M5/M6.
block-tick = []
random-tick = []
falling-blocks = []
block-physics = ["block-tick", "falling-blocks"]
fluid = ["block-tick"]
weather = []
npc = []
encounter-manager = ["npc", "weather"]
