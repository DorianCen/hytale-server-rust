[workspace]
resolver = "2"
members = [
    "crates/hytale-math",
    "crates/procedural",
    "crates/worldgen-model",
    "crates/worldgen-hytale",
    "crates/worldgen-cli",
    "crates/worldgen-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rayon = "1"
png = "0.17"
moka = { version = "0.12", features = ["sync"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"

[profile.bench]
debug = true
