[workspace]
resolver = "2"
members = [
    "crates/hytale-math",
    "crates/procedural",
    "crates/worldgen-model",
    "crates/worldgen-hytale",
    "crates/worldgen-cli",
    "crates/worldgen-server",
    "crates/hytale-protocol",
    "crates/hytale-assets",
    "crates/hytale-core",
    "crates/hytale-storage",
    "crates/hytale-world",
    "crates/hytale-entities",
    "crates/hytale-net",
    "crates/hytale-auth",
    "crates/hytale-commands",
    "crates/hytale-server",
    "tools/protocol-dumper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rayon = "1"
png = "0.17"
moka = { version = "0.12", features = ["sync"] }
log = "0.4"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
bytes = "1"
bevy_ecs = "0.16"
bson = "2"
quinn = "0.11"
rcgen = "0.13"
rustls = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
zip = "2"
zstd = "0.13"

[profile.bench]
debug = true
