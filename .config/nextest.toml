# Optional cargo-nextest profiles. `tools/test.sh` uses nextest automatically
# when `cargo-nextest` is installed; plain `cargo test` otherwise.
#
# `fast` is selected with HYTALE_TEST_ASSETS=0 (asset-backed tests return
# early). `assets` and `e2e` are intentionally less parallel: the world-boot
# suites use significant memory and the loopback tests bind UDP ports.

[profile.default]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.fast]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.assets]
fail-fast = false
test-threads = 2
slow-timeout = { period = "180s", terminate-after = 2 }

[profile.slow]
fail-fast = false
test-threads = 2
slow-timeout = { period = "180s", terminate-after = 2 }

[profile.e2e]
fail-fast = false
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 3 }
